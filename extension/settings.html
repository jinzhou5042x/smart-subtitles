<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Settings · Smart Subtitles</title><link rel="stylesheet" href="settings.css"></head>
<body>
<main class="shell">
  <header class="top"><h1>Smart Subtitles</h1><span id="version" class="version"></span></header>

  <section aria-labelledby="translatorHeading">
    <h2 id="translatorHeading">Translator</h2>
    <div id="kinds"></div>

    <!-- The open provider's setup; settings.js places it under that provider's row. -->
    <div id="detail" class="detail" hidden>
      <p id="detailBlurb" class="blurb"></p>
      <p id="attention" class="attention" hidden></p>

      <div class="panel" id="chatgpt" hidden>
        <div id="loginPanel" class="login" data-state="idle" aria-live="polite" aria-atomic="true">
          <p class="login-title"><span class="indicator" aria-hidden="true"></span><strong id="accountStatus">Connect your ChatGPT account</strong></p>
          <p id="loginDetail" class="note"></p>
          <div class="actions"><button id="signin" type="button" class="primary">Continue with ChatGPT</button><button id="returnLogin" type="button" class="primary" hidden>Return to sign-in</button><button id="cancelLogin" type="button" class="link" hidden>Cancel</button><button id="otherAccount" type="button" class="link" hidden>Use a different account</button></div>
          <p class="fine" id="personalNote">Personal plans only. <a href="https://github.com/jinzhou5042x/smart-subtitles#work-accounts-chatgpt-business-enterprise-edu" target="_blank" rel="noopener">Why&nbsp;↗</a></p>
        </div>
        <div id="chatgptReady" class="fields" hidden>
          <div class="field"><label for="account">Account</label><select id="account"></select></div>
          <div class="field"><label for="chatgptModel">Model</label><select id="chatgptModel"></select></div>
          <div class="field" id="effortRow"><label for="chatgptEffort">Effort</label><select id="chatgptEffort"></select></div>
          <div class="actions"><button id="testChatgpt" type="button" class="secondary">Test</button><a href="https://chatgpt.com/settings/usage" target="_blank" rel="noopener">Usage&nbsp;↗</a><button id="signout" type="button" class="link push">Sign out</button></div>
        </div>
      </div>

      <form class="panel" id="cloud" hidden novalidate>
        <div class="fields">
          <div class="field" id="keyRow"><label for="key">API key</label><div class="stack"><p id="keySaved" class="saved" hidden><span id="keyMask"></span><span class="key-actions"><button id="changeKey" type="button" class="link">Change</button><button id="remove" type="button" class="link">Remove</button></span></p><input id="key" type="password" autocomplete="new-password" spellcheck="false"><span class="hint" id="keyHint"><a id="guide" target="_blank" rel="noopener">Get a key&nbsp;↗</a><button id="cancelKey" type="button" class="link" hidden>Cancel</button></span></div></div>
          <div class="field" id="modelRow"><label for="model">Model</label><input id="model" autocomplete="off" spellcheck="false" placeholder="Model name from your provider"></div>
          <div class="field" id="regionRow"><label for="region">Region</label><select id="region"></select></div>
          <div class="field" id="endpointRow"><label for="baseUrl">Server</label><div class="stack"><input id="baseUrl" type="url" autocomplete="off" spellcheck="false" placeholder="https://your-provider.example/v1"><span id="endpointHelp" class="hint"></span></div></div>
        </div>
        <div class="actions"><button id="connect" class="primary" type="submit">Connect</button><button id="removeSetup" type="button" class="link push" hidden>Remove</button></div>
        <p class="secure"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M4.5 7V5.2a3.5 3.5 0 0 1 7 0V7M3.5 7h9v6.5h-9z"/></svg><span><span id="secureText"></span> <a href="legal.html#api-keys" target="_blank">How&nbsp;↗</a></span></p>
      </form>

      <div class="actions" id="useRow" hidden><button type="button" class="primary" id="use">Use</button></div>
      <p id="result" class="feedback" role="status" aria-live="polite"></p>
      <p id="usageLimit" class="feedback-link" hidden><a href="https://chatgpt.com/settings/usage" target="_blank" rel="noopener">Manage ChatGPT usage&nbsp;↗</a></p>
    </div>
  </section>

  <section aria-labelledby="subtitlesHeading">
    <h2 id="subtitlesHeading">Subtitles</h2>
    <div class="group">
      <div class="item"><label for="target">Translate into</label><select id="target" class="inline"></select></div>
      <div class="item"><label for="fontSize">Size</label><div class="range"><input id="fontSize" type="range" min="18" max="100"><output id="fontSizeValue" for="fontSize"></output></div></div>
      <div class="item storage"><p>Saved translations <span id="cacheBytes" class="muted">Checking…</span></p><button id="clear" type="button" class="secondary" aria-haspopup="dialog">Clear…</button></div>
    </div>
    <p id="subtitlesResult" class="feedback" role="status" aria-live="polite"></p>
  </section>

  <footer><a href="https://github.com/jinzhou5042x/smart-subtitles#readme" target="_blank" rel="noopener">User guide</a><a href="legal.html" target="_blank">Privacy</a><a href="https://github.com/jinzhou5042x/smart-subtitles/issues" target="_blank" rel="noopener">Feedback</a></footer>
</main>
<dialog id="clearDialog"><h2>Clear saved translations?</h2><p>Videos will be translated again. Sign-ins and keys stay.</p><div class="actions"><button id="cancelClear" type="button" class="secondary">Keep</button><button id="confirmClear" type="button" class="primary destructive">Clear</button></div></dialog>
<script type="module" src="settings.js"></script>
</body></html>
