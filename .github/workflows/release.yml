name: Companion release
on:
  push:
    tags: ['companion-v*']
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: win-x64
          - os: macos-14
            target: darwin-arm64
          - os: macos-15-intel
            target: darwin-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.1'
      - name: Build and test download
        shell: bash
        run: |
          export RELEASE_VERSION="${GITHUB_REF_NAME#companion-v}"
          node scripts/release.mjs '${{ matrix.target }}'
          node scripts/check-release.mjs "dist/release/SmartSubtitles-Service-${RELEASE_VERSION}-${{ matrix.target }}.zip"
          mkdir -p dist/downloads
          cp "dist/release/SmartSubtitles-Service-${RELEASE_VERSION}-${{ matrix.target }}.zip" 'dist/downloads/SmartSubtitles-Service-${{ matrix.target }}.zip'
          node --input-type=module -e "import {readFileSync,writeFileSync} from 'node:fs'; import {createHash} from 'node:crypto'; const n='SmartSubtitles-Service-${{ matrix.target }}.zip'; writeFileSync('dist/downloads/'+n+'.sha256.txt', createHash('sha256').update(readFileSync('dist/downloads/'+n)).digest('hex')+'  '+n+'\n');"
      - uses: actions/upload-artifact@v4
        with:
          name: companion-${{ matrix.target }}
          path: dist/downloads/*
          if-no-files-found: error
  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: companion-*
          path: downloads
          merge-multiple: true
      - uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const tag = context.ref.replace('refs/tags/', '');
            const body = `Download the ZIP for your computer below (not the source-code archives).\n\n- Windows: win-x64\n- Mac with Apple Silicon: darwin-arm64\n- Mac with Intel: darwin-x64\n\nExtract the ZIP into a permanent folder. Run **Start Subtitles** once to connect the extension. For Codex, run **Set Up Codex** and sign in. Google users can skip Codex setup and select their key file in the extension. Node.js is included.\n\nOn macOS, if the launcher is blocked, review the download and allow it in **System Settings → Privacy & Security**.\n\n[User guide](https://github.com/jinzhou5042x/smart-subtitles#readme)`;
            const {data: release} = await github.rest.repos.createRelease({...context.repo, tag_name: tag, name: `Smart Subtitles companion ${tag.replace('companion-v', '')}`, body, draft: true});
            for (const name of fs.readdirSync('downloads')) {
              await github.rest.repos.uploadReleaseAsset({...context.repo, release_id: release.id, name, data: fs.readFileSync(`downloads/${name}`)});
            }
            await github.rest.repos.updateRelease({...context.repo, release_id: release.id, draft: false, make_latest: 'true'});
