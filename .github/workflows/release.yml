name: Release
on:
  push:
    tags: ['companion-v*']
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: win-x64
          - os: macos-14
            target: darwin-arm64
          - os: macos-15-intel
            target: darwin-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.1'
      - name: Build and test download
        shell: bash
        run: |
          export RELEASE_VERSION="${GITHUB_REF_NAME#companion-v}"
          node scripts/release.mjs '${{ matrix.target }}'
          node scripts/check-release.mjs "dist/release/SmartSubtitles-Service-${RELEASE_VERSION}-${{ matrix.target }}.zip"
          mkdir -p dist/downloads
          cp "dist/release/SmartSubtitles-Service-${RELEASE_VERSION}-${{ matrix.target }}.zip" 'dist/downloads/SmartSubtitles-Service-${{ matrix.target }}.zip'
          node --input-type=module -e "import {readFileSync,writeFileSync} from 'node:fs'; import {createHash} from 'node:crypto'; const n='SmartSubtitles-Service-${{ matrix.target }}.zip'; writeFileSync('dist/downloads/'+n+'.sha256.txt', createHash('sha256').update(readFileSync('dist/downloads/'+n)).digest('hex')+'  '+n+'\n');"
      - name: Package extension for store upload
        if: matrix.target == 'win-x64'
        shell: bash
        run: |
          node scripts/package.mjs
          cp dist/store/smart-subtitles-*.zip dist/downloads/
      - uses: actions/upload-artifact@v4
        with:
          name: companion-${{ matrix.target }}
          path: dist/downloads/*
          if-no-files-found: error
  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: companion-*
          path: downloads
          merge-multiple: true
      - uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const tag = context.ref.replace('refs/tags/', '');
            const body = `Smart Subtitles now runs as a standalone Chrome extension. Browser translation needs no key or companion. Google Cloud, OpenAI, DeepSeek, Claude, Qwen and compatible/local APIs connect directly from the extension. Translation follows the playhead, with a browser cache.\n\nThe **SmartSubtitles-Service** downloads are optional and only for **Codex subscription**:\n- Windows: win-x64\n- Mac with Apple Silicon: darwin-arm64\n- Mac with Intel: darwin-x64\n\nExtract into a permanent folder, run **Set Up Codex** once, then choose **Codex subscription → Connect Codex** in Translator settings. Node.js is bundled. macOS may require allowing the launcher in **System Settings → Privacy & Security**.\n\nThe **smart-subtitles-${tag.replace('companion-v', '')}.zip** file is the extension package for store upload or manual developer-mode installation. This GitHub release does not update the Chrome Web Store listing.\n\n[User guide](https://github.com/jinzhou5042x/smart-subtitles#readme)`;
            const {data: release} = await github.rest.repos.createRelease({...context.repo, tag_name: tag, name: `Smart Subtitles ${tag.replace('companion-v', '')}`, body, draft: true});
            for (const name of fs.readdirSync('downloads')) {
              await github.rest.repos.uploadReleaseAsset({...context.repo, release_id: release.id, name, data: fs.readFileSync(`downloads/${name}`)});
            }
            await github.rest.repos.updateRelease({...context.repo, release_id: release.id, draft: false, make_latest: 'true'});
