name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  extension:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run check:extension
      - run: npm run check:chatgpt
      - run: npm run package
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const fs = require('fs');
            const crypto = require('crypto');
            const tag = context.ref.replace('refs/tags/', '');
            const version = JSON.parse(fs.readFileSync('extension/manifest.json')).version;
            if (tag !== `v${version}`) throw new Error('Tag and extension versions differ');
            const name = `smart-subtitles-${version}.zip`;
            const data = fs.readFileSync(`dist/store/${name}`);
            const body = `All translators now connect from the Chrome extension. No companion app, Node.js installation, terminal commands or native messaging.\n\n- Browser translation remains the default.\n- ChatGPT subscription: choose **Continue with ChatGPT** in Settings. Credentials stay in memory; sign in again after fully quitting Chrome. Account eligibility and limits are determined by OpenAI.\n- Google Cloud and other API providers connect directly using your own key.\n- Subtitles still translate in order from the beginning; seeking does not reorder the queue.\n\nThis ZIP is the same extension package for Windows, macOS and Linux, for store upload or developer-mode installation. This GitHub release does not update the Chrome Web Store listing.\n\n[User guide](https://github.com/jinzhou5042x/smart-subtitles#readme)`;
            const {data: release} = await github.rest.repos.createRelease({...context.repo, tag_name: tag, name: `Smart Subtitles ${version}`, body, draft: true});
            await github.rest.repos.uploadReleaseAsset({...context.repo, release_id: release.id, name, data});
            await github.rest.repos.uploadReleaseAsset({...context.repo, release_id: release.id, name: name + '.sha256.txt', data: Buffer.from(crypto.createHash('sha256').update(data).digest('hex') + '  ' + name + '\n')});
            await github.rest.repos.updateRelease({...context.repo, release_id: release.id, draft: false, make_latest: 'true'});
