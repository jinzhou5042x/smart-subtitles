name: Test
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-14, macos-15-intel, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run check:extension
      # Not on Windows: there Playwright's Chromium (1248) renderer sometimes dies with an access
      # violation (0xC0000005) while a newly opened sign-in tab commits its page. Measured in 48-run
      # experiments on 2026-10-18; it is a Chromium bug, not this extension. Recheck after a Playwright upgrade.
      - run: npm run check:chatgpt
        if: runner.os != 'Windows'
      - run: npm run package
      - name: Check that the extension scripts parse
        shell: bash
        run: for f in extension/*.js; do node --check "$f" 2>/dev/null || node --input-type=module --check < "$f"; done
